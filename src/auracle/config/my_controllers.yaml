controller_manager:
  ros__parameters:
    update_rate: 30 # Hz

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom

    left_wheel_names: ['left_wheel_one_joint', 'left_wheel_two_joint', 'left_wheel_three_joint']
    right_wheel_names: ['right_wheel_one_joint', 'right_wheel_two_joint', 'right_wheel_three_joint']

    wheel_separation: 0.22 # estimate from chassis_width/rocker geometry - tune by driving straight and comparing travel
    wheel_radius: 0.033

    use_stamped_vel: false

    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]